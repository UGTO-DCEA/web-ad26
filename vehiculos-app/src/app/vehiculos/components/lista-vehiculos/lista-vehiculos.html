@for (vehiculo of listaVehiculos(); track vehiculo.id) {
  <p>{{ vehiculo.modelo }}</p>
  <p>{{ vehiculo.year }}</p>
  <button (click)="eliminarVehiculo(vehiculo.id)">Eliminar</button>
  <button (click)="editarVehiculo(vehiculo.id)">Editar</button>
}

@if (editarComponent()) {
  <app-editar-vehiculo [vehiculoId]="vehiculoIdLista()"></app-editar-vehiculo>
}
