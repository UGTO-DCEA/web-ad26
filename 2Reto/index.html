<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="css/bootstrap.css" />
    <title>Café DCEA</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Café DCEA</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Link</a>
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Dropdown
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Action</a></li>
                <li><a class="dropdown-item" href="#">Another action</a></li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                  <a class="dropdown-item" href="#">Something else here</a>
                </li>
              </ul>
            </li>
            <li class="nav-item">
              <a class="nav-link disabled" aria-disabled="true">Disabled</a>
            </li>
          </ul>
          <form class="d-flex" role="search">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Search"
              aria-label="Search"
            />
            <button class="btn btn-outline-success" type="submit">
              Search
            </button>
          </form>
        </div>
      </div>
    </nav>
    <div class="container text-center" style="margin-top: 50px">
      <div class="row">
        <div class="col">
          <div class="card" style="width: 18rem">
            <img
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcShFJEWEFIP03nDc5KvU2OT2MklPac1u9gGOOqL_AhqlkgnmYmpFC72RxE&s=10"
              class="card-img-top"
              alt="..."
            />
            <div class="card-body">
              <p class="card-text">Café capuccino</p>
              <p class="card-text">$ 35.00</p>
              <p class="card-text">200 ml</p>
              <button class="btn btn-primary">Pedir</button>
            </div>
          </div>
        </div>
        <div class="col">Column</div>
        <div class="col">Column</div>
      </div>
    </div>

    <button class="btn btn-success">Entrar</button>
    <button class="btn btn-danger">Salir</button>
    -->

</html>
